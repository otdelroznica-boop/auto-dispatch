<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Диспетчер">
  <title>Диспетчерская</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="static/icon-192.png">
  <link rel="apple-touch-icon" href="static/icon-180.png">
  <link rel="stylesheet" href="static/style.css?v=4">
</head>
<body>

<!-- Вход -->
<section id="loginScreen" class="login hidden">
  <div class="login-card">
    <div class="login-logo"><svg><use href="#i-truck"/></svg></div>
    <h1 id="loginTitle">Диспетчерская</h1>
    <p class="muted">Кто работает?</p>
    <div id="loginUsers" class="login-users"></div>
    <div id="pinBox" class="pin-box hidden">
      <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
      <div class="pin-pad" id="pinPad"></div>
      <p class="error" id="loginError"></p>
    </div>
  </div>
</section>

<!-- Приложение -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand" data-view="day" title="На главный экран" style="cursor:pointer">
      <svg class="brand-icon"><use href="#i-truck"/></svg>
      <div>
        <div class="brand-name" id="brandName">Диспетчерская</div>
        <div class="brand-sub" id="brandUser"></div>
      </div>
    </div>

    <div class="datebar">
      <button class="icon-btn" id="prevDay" aria-label="Предыдущий день"><svg><use href="#i-left"/></svg></button>
      <label class="date-pick">
        <span id="dateLabel">—</span>
        <input type="date" id="dateInput">
      </label>
      <button class="icon-btn" id="nextDay" aria-label="Следующий день"><svg><use href="#i-right"/></svg></button>
      <button class="chip" id="todayBtn">Сегодня</button>
    </div>

    <nav class="top-actions">
      <button class="btn btn-primary" id="newOrderBtn"><svg><use href="#i-plus"/></svg><span>Заказ</span></button>
      <button class="btn btn-ghost desk-only" data-view="day"><svg><use href="#i-calendar"/></svg><span>День</span></button>
      <button class="btn btn-ghost desk-only" data-view="report"><svg><use href="#i-chart"/></svg><span>Отчёты</span></button>
      <button class="btn btn-ghost desk-only" data-view="clients"><svg><use href="#i-users"/></svg><span>Клиенты</span></button>
      <button class="btn btn-ghost desk-only" data-view="settings"><svg><use href="#i-gear"/></svg><span>Настройки</span></button>
    </nav>
  </header>

  <!-- Вид: день -->
  <main id="viewDay" class="view">
    <div class="day-toolbar">
      <div class="seg" id="vehicleTabs"></div>
      <div class="seg phone-only" id="phoneMode">
        <button data-mode="timeline" class="active">Шкала</button>
        <button data-mode="list">Список</button>
      </div>
      <div class="day-stats" id="dayStats"></div>
    </div>

    <div class="day-body">
      <aside class="order-list-pane" id="listPane">
        <div class="list-head">
          <div class="search">
            <svg><use href="#i-search"/></svg>
            <input type="search" id="searchInput" placeholder="Телефон, имя, адрес">
          </div>
          <div class="seg seg-sm" id="statusTabs">
            <button data-status="all" class="active">Все</button>
            <button data-status="new">Новые</button>
            <button data-status="work">В работе</button>
            <button data-status="done">Готово</button>
          </div>
        </div>
        <div id="orderList" class="order-list"></div>
      </aside>

      <section class="timeline-pane" id="timelinePane">
        <div class="timeline" id="timeline"></div>
      </section>
    </div>
  </main>

  <!-- Вид: отчёты -->
  <main id="viewReport" class="view hidden">
    <div class="page">
      <div class="page-head">
        <h2>Отчёт</h2>
        <button class="btn btn-ghost" id="exportBtn"><svg><use href="#i-download"/></svg><span>Excel</span></button>
      </div>
      <div class="period">
        <div class="seg seg-wrap" id="periodTabs">
          <button data-period="today">Сегодня</button>
          <button data-period="yesterday">Вчера</button>
          <button data-period="week" class="active">Неделя</button>
          <button data-period="month">Месяц</button>
          <button data-period="prevmonth">Прошлый месяц</button>
        </div>
        <div class="period-range">
          <input type="date" id="repFrom"> <span>—</span> <input type="date" id="repTo">
        </div>
      </div>
      <div id="reportBody"></div>
    </div>
  </main>

  <!-- Вид: клиенты -->
  <main id="viewClients" class="view hidden">
    <div class="page">
      <div class="page-head">
        <h2>Клиенты</h2>
        <button class="btn btn-primary" id="newClientBtn"><svg><use href="#i-plus"/></svg><span>Клиент</span></button>
      </div>
      <div class="search search-wide">
        <svg><use href="#i-search"/></svg>
        <input type="search" id="clientSearch" placeholder="Телефон, имя или ИНН">
      </div>
      <div id="clientList" class="card-list"></div>
    </div>
  </main>

  <!-- Вид: настройки -->
  <main id="viewSettings" class="view hidden">
    <div class="page" id="settingsBody"></div>
  </main>

  <!-- Нижняя панель (телефон) -->
  <nav class="bottom-nav" id="bottomNav">
    <button data-view="day" class="active"><svg><use href="#i-calendar"/></svg><span>День</span></button>
    <button data-view="report"><svg><use href="#i-chart"/></svg><span>Отчёты</span></button>
    <button class="fab" id="fabNew" aria-label="Новый заказ"><svg><use href="#i-plus"/></svg></button>
    <button data-view="clients"><svg><use href="#i-users"/></svg><span>Клиенты</span></button>
    <button data-view="settings"><svg><use href="#i-gear"/></svg><span>Ещё</span></button>
  </nav>
</div>

<!-- Окно заказа -->
<div class="sheet-backdrop hidden" id="orderSheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
      <h3 id="orderTitle">Новый заказ</h3>
      <button class="btn btn-primary btn-sm" id="saveOrderTop">Сохранить</button>
    </div>
    <div class="sheet-body">
      <div class="seg seg-full" id="ofVehicle"></div>

      <div class="row-3">
        <label class="field"><span>Дата</span><input type="date" id="ofDate"></label>
        <label class="field"><span>С</span><select id="ofStart"></select></label>
        <label class="field"><span>До</span><select id="ofEnd"></select></label>
      </div>
      <div class="chips" id="ofDuration">
        <button data-min="60">1 ч</button><button data-min="90">1,5 ч</button><button data-min="120">2 ч</button>
        <button data-min="180">3 ч</button><button data-min="240">4 ч</button>
      </div>
      <div class="warn hidden" id="ofConflict"></div>

      <div class="block">
        <div class="block-title">Клиент</div>
        <div class="client-pick">
          <label class="field field-phone">
            <span>Телефон</span>
            <input type="tel" id="ofPhone" inputmode="tel" autocomplete="off" placeholder="+7 ___ ___-__-__">
          </label>
          <div class="suggest hidden" id="ofSuggest"></div>
        </div>
        <div class="client-found hidden" id="ofClientFound"></div>
        <div class="row-2">
          <label class="field"><span id="ofNameLabel">Имя</span><input type="text" id="ofName" autocomplete="off"></label>
          <div class="seg seg-sm kind" id="ofKind">
            <button data-kind="person" class="active">Физлицо</button>
            <button data-kind="org">Организация</button>
          </div>
        </div>
        <label class="field hidden" id="ofInnWrap"><span>ИНН</span><input type="text" id="ofInn" inputmode="numeric"></label>
      </div>

      <div class="block">
        <div class="block-title">Услуги</div>
        <div class="chips chips-services" id="ofServiceChips"></div>
        <div id="ofLines" class="lines"></div>
        <button class="link-btn" id="ofAddCustom">+ Своя услуга</button>
      </div>

      <div class="block money">
        <label class="field"><span>Расчёт, ₽</span><input type="number" id="ofPlan" inputmode="decimal" min="0"></label>
        <label class="field">
          <span>Взяли, ₽</span>
          <div class="input-with-btn">
            <input type="number" id="ofPaid" inputmode="decimal" min="0">
            <button class="chip" id="ofPaidFull" type="button">= всё</button>
          </div>
        </label>
        <div class="seg seg-sm seg-full" id="ofPay">
          <button data-pay="cash" class="active">Наличные</button>
          <button data-pay="card">Перевод</button>
          <button data-pay="invoice">Безнал</button>
        </div>
      </div>

      <div class="block">
        <label class="field"><span>Водитель</span><select id="ofDriver"></select></label>
        <label class="field"><span>Откуда</span><input type="text" id="ofFrom" placeholder="Адрес подачи"></label>
        <label class="field"><span>Куда</span><input type="text" id="ofTo" placeholder="Необязательно"></label>
        <label class="field"><span>Комментарий</span><textarea id="ofNote" rows="2" placeholder="Машина, поломка, груз"></textarea></label>
      </div>

      <div class="block">
        <div class="block-title">Статус</div>
        <div class="seg seg-sm seg-full" id="ofStatus">
          <button data-status="new" class="active">Новый</button>
          <button data-status="work">В работе</button>
          <button data-status="done">Выполнен</button>
          <button data-status="cancel">Отменён</button>
        </div>
      </div>

      <div class="order-extra hidden" id="ofExtra">
        <a class="btn btn-ghost" id="ofCall"><svg><use href="#i-phone"/></svg><span>Позвонить</span></a>
        <a class="btn btn-ghost" id="ofMap" target="_blank" rel="noopener"><svg><use href="#i-map"/></svg><span>Маршрут</span></a>
        <button class="btn btn-ghost" id="ofShare"><svg><use href="#i-send"/></svg><span>Водителю</span></button>
        <button class="btn btn-danger-ghost" id="ofDelete"><svg><use href="#i-trash"/></svg><span>Удалить</span></button>
      </div>
      <div class="meta muted" id="ofMeta"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary btn-block" id="saveOrderBtn">Сохранить</button>
    </div>
  </div>
</div>

<!-- Универсальное окно (справочники, клиент, быстрая оплата) -->
<div class="sheet-backdrop hidden" id="dialog">
  <div class="sheet sheet-narrow" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
      <h3 id="dialogTitle"></h3>
      <span></span>
    </div>
    <div class="sheet-body" id="dialogBody"></div>
    <div class="sheet-foot" id="dialogFoot"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>

    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>

    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></symbol>
  </defs>
</svg>

<script src="static/demo-api.js"></script>
<script src="static/app.js?v=4"></script>
</body>
</html>
